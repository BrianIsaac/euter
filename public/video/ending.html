<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Euterpe video closing page." />
    <title>Euterpe</title>
    <style>
      :root {
        --bg: #14161b;
        --panel: #1c1f26;
        --line: #2f3442;
        --text: #e7e9ee;
        --muted: #9aa3b2;
        --accent: #7dd3c0;
        --accent-2: #e8c26a;
        --agent: #b48cff;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color-scheme: dark;
        font-family: var(--sans);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 45%, rgb(125 211 192 / 8%), transparent 34%), var(--bg);
      }

      .closing {
        width: min(1120px, calc(100vw - 80px));
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font: 600 clamp(11px, 1vw, 14px) var(--mono);
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(64px, 9vw, 150px);
        font-weight: 600;
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      .tagline {
        margin-top: 24px;
        color: var(--muted);
        font-size: clamp(19px, 2vw, 32px);
      }

      .facts {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 30px 0 34px;
      }

      .fact {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 12px;
        background: var(--panel);
        font: clamp(11px, 0.95vw, 14px) var(--mono);
      }

      .fact:nth-child(1) {
        border-color: rgb(180 140 255 / 55%);
        color: var(--agent);
      }

      .fact:nth-child(2) {
        border-color: rgb(125 211 192 / 55%);
        color: var(--accent);
      }

      .fact:nth-child(3) {
        border-color: rgb(232 194 106 / 55%);
        color: var(--accent-2);
      }

      .url {
        font: 600 clamp(21px, 2.4vw, 38px) var(--mono);
      }

      .source {
        margin-top: 8px;
        color: var(--muted);
        font: clamp(11px, 1vw, 14px) var(--mono);
      }

      .pulse-line {
        display: flex;
        width: min(580px, 70vw);
        height: 48px;
        margin: 0 auto 24px;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .pulse-line span {
        width: 3px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        animation: pulse 1.8s ease-in-out infinite;
      }

      .pulse-line span:nth-child(3n) {
        background: var(--agent);
        animation-delay: -0.6s;
      }

      .pulse-line span:nth-child(3n + 1) {
        background: var(--accent-2);
        animation-delay: -1.2s;
      }

      @keyframes pulse {
        0%,
        100% {
          height: 8px;
          opacity: 0.55;
        }
        50% {
          height: 38px;
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse-line span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="closing" aria-label="Euterpe closing page">
      <p class="eyebrow">A person and their agent, making music together</p>
      <h1>Euterpe</h1>
      <p class="tagline">Hum a melody. Make a song with your agent.</p>
      <div class="facts" aria-label="Project facts">
        <span class="fact">28 WebMCP tools</span>
        <span class="fact">visible, explained and undoable</span>
        <span class="fact">the person stays in control</span>
      </div>
      <div class="pulse-line" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span
        ><span></span><span></span><span></span><span></span><span></span><span></span><span></span
        ><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="url">euter.pages.dev</p>
      <p class="source">Source linked on Devpost &middot; MIT</p>
    </main>
  </body>
</html>
